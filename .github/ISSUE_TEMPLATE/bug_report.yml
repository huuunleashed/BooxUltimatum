name: Bug report
description: Something in BooxUltimatum doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. BooxUltimatum is best tested on the maintainer's Note Air6 C, so the details below, above all your tablet model and firmware, matter a lot. Please remove personal data (network names, account names, notification text, book titles) from anything you paste."
  - type: input
    id: device
    attributes:
      label: Tablet and firmware
      description: The tablet model, and the firmware version from Settings › About (for example "Note Air6 C, 4.3 (2026-08-17)").
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BooxUltimatum version
      description: Shown on BooxUltimatum's Device page as Installed version, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Choose the closest match. These are the same areas as in the app's Report a problem or idea page.
      options:
        - Home screen
        - Sleep screen
        - Instant ink
        - Battery
        - Tweaks
        - Appearance or fonts
        - Nib (drawing)
        - Suite, updates or logs
        - Something else
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: Access level
      description: See "How much access it needs" in the README.
      options:
        - T0 (just the app)
        - T1 (adb grants)
        - T2 (Shizuku running)
        - Not sure
  - type: dropdown
    id: orientation
    attributes:
      label: Orientation
      options:
        - Portrait
        - Landscape
        - Both
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots (optional)
      description: "For example the output of `adb logcat -d | findstr booxultimatum` (Android's log, read from a computer connected to the tablet), or a screenshot."
      render: text
