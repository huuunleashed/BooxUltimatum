name: Build

# Checks that every push and pull request builds and passes lint and the prose rule. Uses the debug key; releases are signed locally.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prose rule
        run: python3 tools/dev/prose_wrap.py
      - name: Build and lint
        run: ./gradlew assembleRelease lintRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: booxultimatum-debug-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
