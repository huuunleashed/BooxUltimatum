name: Pages

# Publishes the landing page in site/, together with the README screenshots and brand images, to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", "docs/brand/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/screenshots _site/brand
          cp docs/screenshots/*.png _site/screenshots/
          cp docs/brand/*.png _site/brand/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
